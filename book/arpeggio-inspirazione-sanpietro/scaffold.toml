# ARPEGGIO · ISPIRAZIONE · SAN PIETRO — entheai fan-out scaffold
# Feed this to: entheai --fanout --config <entheai.toml> "<the arpeggio brief>"
# entheai (deepseek via openrouter, or local HF-mac model) decomposes +
# integrates; each [[coder]] runs via the Antigravity CLI (agy).

[book]
title = "ARPEGGIO · ISPIRAZIONE · SAN PIETRO"
subtitle = "the basilica of a broken chord"
author = "Szellem (Brett Shaw)"
epigraph = "Tu es Petrus, et super hanc petram aedificabo ecclesiam meam."
published = 2026

[fanout]
executor = "agy"                     # coder backend (Antigravity CLI)
model = "openrouter/deepseek/deepseek-chat"  # entheai's brain (deepseek)
agy_model = "gemini-3.6-flash-high"  # model agy runs each coder on
max_depth = 3

# Tone for every scribe: the manuscript is the source of truth. Polish for
# book form, never discard the source lines. Voice: Szellem (Brett Shaw)
# addressing Péter directly — devotional, second person, Italian refrains.

# ─── FRONT MATTER ────────────────────────────────────────────────────────

[[coder]]
role = "scribe"
chapter = 0
file = "chapters/00-dedication.md"
task = """
Write the front matter: dedication page, epigraph, and a one-page prologue.
Every original line of the manuscript is sacred — restore it verbatim.
Tone: match the source.
"""

# ─── PART I · ARPEGGIO ───────────────────────────────────────────────────

[[coder]]
role = "scribe"
chapter = 1
file = "chapters/01-il-silenzio-tra-le-note.md"
task = """
SEED: the "1. Il Silenzio tra le Note" section of the manuscript.
Expand for book form. KEEP ALL ORIGINAL LINES. Voice: the chord that
learned to wait; the basilica built of silences between notes.
"""
depends_on = [0]

[[coder]]
role = "scribe"
chapter = 2
file = "chapters/02-la-chitarra-zen.md"
task = """
SEED: the "2. La Chitarra Zen" section of the manuscript.
Expand for book form. KEEP ALL ORIGINAL LINES. Voice: the guitar cannot
hold a chord; every guitar chord is a secret arpeggio; letting go.
"""
depends_on = [1]

[[coder]]
role = "scribe"
chapter = 3
file = "chapters/03-larpeggio-del-tempo.md"
task = """
SEED: the "3. L'Arpeggio del Tempo" section of the manuscript.
Expand for book form. KEEP ALL ORIGINAL LINES. Voice: time is an arpeggio;
the basilica played note by note across four hundred years.
"""
depends_on = [2]

