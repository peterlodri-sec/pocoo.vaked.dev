# GEPEK-URA — entheai fan-out scaffold (restoration)
# Feed this to: entheai --fanout --config <entheai.toml> "<the gepek-ura brief>"
# entheai (deepseek via openrouter, or local HF-mac model) decomposes +
# integrates; each [[coder]] runs via the Antigravity CLI (agy).

[book]
title = "GÉPEK URA — Cosmic Game II"
subtitle = "restored from the original manuscript"
author = "entheai · agy · deepseek"
epigraph = ""
published = 2026

[fanout]
