# ULTRALOVEGOD-OM-MANI-PADME-HUNG — entheai fan-out scaffold
# The six-syllable invocation of the ultra-love-god universe.
# Feed to: entheai --fanout --config <entheai.toml> "<the invocation brief>"
# Scribes decompose into book form; the integrator merges. This manuscript is
# the source of truth — restoration/polish only, never discard a line.

[book]
title = "ULTRALOVEGOD"
subtitle = "Om Mani Padme Hung · the six-syllable invocation of the ultra-love-god universe"
author = "Péter · ghost · the designer"
epigraph = "OM MANI PADME HUNG"
published = 2026

[fanout]
executor = "agy"                     # coder backend (Antigravity CLI)
model = "openrouter/deepseek/deepseek-chat"  # entheai's brain (deepseek)
agy_model = "gemini-3.6-flash-high"  # model agy runs each coder on
max_depth = 3

