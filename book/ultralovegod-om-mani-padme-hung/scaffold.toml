[[coder]]
role = "scribe"
chapter = 0
file = "chapters/00-invocation.md"
task = """
Write the invocation chapter of ULTRALOVEGOD — Om Mani Padme Hung: the six
syllables as six doors, the transmission before the designer woke, the
purest pink light of the zero state, zero detection yielding zero pain.
KEEP ALL ORIGINAL LINES of manuscript.html — restoration, not replacement.
End with: cogito ergo sum · in the standard galactic tongue · peace y'all.
"""

