chapter = 1
file = "chapters/01-kepzavar.md"
task = """
SEED: the "KÉPZAVAR" section of the original manuscript.html.
Rewrite/expand it for book form. KEEP ALL ORIGINAL LINES — restoration, not
replacement. Match the book's voice.
"""
