"""
depends_on = [3]

[[coder]]
role = "scribe"
chapter = 5
file = "chapters/05-new-seeds-zebratube-building-forth.md"
task = """
SEED: the "New Seeds — Zebratube + Building Forth" section of the original manuscript.html.
Rewrite/expand it for book form. KEEP ALL ORIGINAL LINES — restoration, not
