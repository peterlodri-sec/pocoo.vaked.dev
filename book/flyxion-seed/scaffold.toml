"""
depends_on = [4]

[[coder]]
role = "integrator"
file = "FLYXION-SEED.md"
task = """
INTEGRATE the front matter + all 5 chapters into a single manuscript.
Verify every original line survived. Add part dividers where the source has
them. Add the dedication page first and the epigraph.
Add colophon: "Restored through the fan-out, 2026." Output as one clean
markdown file ready for print.
"""
depends_on = [0, 1, 2, 3, 4]
