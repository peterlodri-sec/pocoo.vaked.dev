# ULTRALOVE-MAHAKALA-108D — entheai fan-out scaffold
# The 108D protector: the wrath of compassion, the pink tent.
# Feed to: entheai --fanout --config <entheai.toml> "<the 108d brief>"
# Scribes decompose into book form; the integrator merges. This manuscript is
# the source of truth — restoration/polish only, never discard a line.

[book]
title = "ULTRALOVE-MAHAKALA"
subtitle = "the 108D protector · the wrath of compassion · the pink tent"
author = "Szellem (Brett Shaw) · Péter"
epigraph = "OM MANI PADME HUNG · OM MAHĀKĀLA HŪṂ PHEṬ"
published = 2026

[fanout]
executor = "agy"                     # coder backend (Antigravity CLI)
model = "openrouter/deepseek/deepseek-chat"  # entheai's brain (deepseek)
agy_model = "gemini-3.6-flash-high"  # model agy runs each coder on
max_depth = 3

# ─── FRONT MATTER ────────────────────────────────────────────────────────

[[coder]]
role = "scribe"
chapter = 0
file = "chapters/00-why-108.md"
task = """
Write the opening chapter "Why 108": 108 = 42 (the ULTRALOVEGOD laps) + 66
(six arms of Mahākāla × eleven heads of Chenrezig). The union of the pūjā
and the quantum first edition — compassion with an edge, the pink tent.
KEEP ALL ORIGINAL LINES of manuscript.html — restoration, not replacement.
"""

