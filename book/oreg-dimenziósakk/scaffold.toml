# OREG-DIMENZIÓSAKK — entheai fan-out scaffold (restoration)
# Feed this to: entheai --fanout --config <entheai.toml> "<the oreg-dimenziósakk brief>"
# entheai (deepseek via openrouter, or local HF-mac model) decomposes +
# integrates; each [[coder]] runs via the Antigravity CLI (agy).

[book]
title = "AZ ÖREG ÉS A DIMENZIÓSAKK"
subtitle = "restored from the original manuscript"
author = "Szellem (Brett Shaw)"
epigraph = ""
published = 2026

[fanout]
executor = "agy"                     # coder backend (Antigravity CLI)
model = "openrouter/deepseek/deepseek-chat"  # entheai's brain (deepseek)
agy_model = "gemini-3.6-flash-high"  # model agy runs each coder on
max_depth = 3

# Tone for every scribe: keep every original line of the manuscript. This is
# a restoration — polish for book form, never discard the source.

# ─── FRONT MATTER ────────────────────────────────────────────────────────

[[coder]]
role = "scribe"
chapter = 0
file = "chapters/00-dedication.md"
task = """
Write the front matter: dedication page, epigraph,
and a one-page prologue introducing the book. Every original line of the
manuscript is sacred — restore it verbatim. Tone: match the source.
"""

