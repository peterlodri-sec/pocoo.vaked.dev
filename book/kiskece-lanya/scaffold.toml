# KISKECE-LANYA — entheai fan-out scaffold (restoration)
# Feed this to: entheai --fanout --config <entheai.toml> "<the kiskece-lanya brief>"
# entheai (deepseek via openrouter, or local HF-mac model) decomposes +
# integrates; each [[coder]] runs via the Antigravity CLI (agy).

[book]
title = "Kiskece Lányom"
subtitle = "restored from the original manuscript"
author = "Szellem (Brett Shaw)"
epigraph = ""
published = 2026

[fanout]
executor = "agy"                     # coder backend (Antigravity CLI)
model = "openrouter/deepseek/deepseek-chat"  # entheai's brain (deepseek)
agy_model = "gemini-3.6-flash-high"  # model agy runs each coder on
max_depth = 3

# Tone for every scribe: keep every original line of the manuscript. This is
# a restoration — polish for book form, never discard the source.

# ─── FRONT MATTER ────────────────────────────────────────────────────────

[[coder]]
role = "scribe"
chapter = 0
file = "chapters/00-dedication.md"
task = """
Write the front matter: dedication page, epigraph,
and a one-page prologue introducing the book. Every original line of the
manuscript is sacred — restore it verbatim. Tone: match the source.
"""

# ─── CHAPTERS ────────────────────────────────────────────────────────────

[[coder]]
role = "scribe"
chapter = 1
file = "chapters/01-kiskece-lanyom.md"
task = """
SEED: the "KISKECE LÁNYOM" section of the original manuscript.html.
Rewrite/expand it for book form. KEEP ALL ORIGINAL LINES — restoration, not
replacement. Match the book's voice.
"""
depends_on = [0]

[[coder]]
role = "scribe"
chapter = 2
file = "chapters/02-a-nepdal.md"
task = """
SEED: the "A Népdal" section of the original manuscript.html.
Rewrite/expand it for book form. KEEP ALL ORIGINAL LINES — restoration, not
replacement. Match the book's voice.
"""
depends_on = [1]

[[coder]]
role = "scribe"
chapter = 3
file = "chapters/03-a-csarnokban.md"
task = """
SEED: the "A Csarnokban" section of the original manuscript.html.
Rewrite/expand it for book form. KEEP ALL ORIGINAL LINES — restoration, not
replacement. Match the book's voice.
"""
depends_on = [2]

[[coder]]
role = "integrator"
file = "KISKECE-LANYA.md"
task = """
INTEGRATE the front matter + all 3 chapters into a single manuscript.
Verify every original line survived. Add part dividers where the source has
them. Add the dedication page first and the epigraph.
Add colophon: "Restored through the fan-out, 2026." Output as one clean
markdown file ready for print.
"""
depends_on = [0, 1, 2]
