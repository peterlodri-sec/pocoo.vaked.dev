<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="60%" stop-color="#020810"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#1a3a5c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="50%" stop-color="#f0d060"/>
      <stop offset="100%" stop-color="#8b6914"/>
    </linearGradient>
    <linearGradient id="texture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1f2d" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#162d40" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="blur1"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur2"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="blur3"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="glowFilter">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1600" fill="url(#bg)"/>
  <rect width="1200" height="1600" fill="url(#glow)"/>

  <!-- Granite texture overlay -->
  <rect width="1200" height="1600" fill="url(#texture)" filter="url(#noise)" opacity="0.3"/>

  <!-- Quantum field particles -->
  <g opacity="0.15">
    <circle cx="200" cy="400" r="1.5" fill="#3fe0ef">
      <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="850" cy="550" r="1" fill="#c9a84c">
      <animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="600" cy="300" r="1.5" fill="#3fe0ef">
      <animate attributeName="opacity" values="0.1;0.7;0.1" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="700" r="1" fill="#c9a84c">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="5.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="950" cy="800" r="1.2" fill="#3fe0ef">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="150" cy="950" r="0.8" fill="#f0d060">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="1200" r="1" fill="#3fe0ef">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Mesh network lines -->
  <g opacity="0.12" stroke="#3fe0ef" stroke-width="0.8" fill="none">
    <line x1="100" y1="380" x2="500" y2="250"/>
    <line x1="500" y1="250" x2="800" y2="400"/>
    <line x1="800" y1="400" x2="600" y2="600"/>
    <line x1="600" y1="600" x2="300" y2="550"/>
    <line x1="300" y1="550" x2="100" y2="380"/>
    <line x1="100" y1="380" x2="300" y2="650"/>
    <line x1="500" y1="250" x2="700" y2="580"/>
    <line x1="800" y1="400" x2="950" y2="600"/>
    <line x1="600" y1="600" x2="850" y2="750"/>
    <line x1="300" y1="550" x2="400" y2="750"/>
    <line x1="600" y1="600" x2="500" y2="800"/>
    <line x1="800" y1="400" x2="900" y2="250"/>
  </g>

  <!-- Central Ω (Omega) — the HarmonyOhm symbol -->
  <text x="600" y="520" text-anchor="middle" font-family="serif" font-size="280" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.85" filter="url(#glowFilter)">Ω</text>

  <!-- Subtle terminal cursor blink -->
  <rect x="755" y="370" width="12" height="28" fill="#3fe0ef" opacity="0.9">
    <animate attributeName="opacity" values="0.9;0;0;0.9" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Title -->
  <text x="600" y="680" text-anchor="middle" font-family="monospace" font-size="52" font-weight="bold" fill="#e8d8a0" letter-spacing="6">QUANT-LOVE</text>
  <text x="600" y="740" text-anchor="middle" font-family="monospace" font-size="28" fill="#8fa3b0" letter-spacing="12">VIA  BRETT  SHAW</text>

  <!-- Divider line -->
  <line x1="300" y1="780" x2="900" y2="780" stroke="url(#gold)" stroke-width="1" opacity="0.5"/>

  <!-- Subtitle -->
  <text x="600" y="840" text-anchor="middle" font-family="monospace" font-size="18" fill="#5a7a8a" letter-spacing="4">FORTY-TWO LAPS INSIDE THE SOVEREIGN HALL</text>
  <text x="600" y="875" text-anchor="middle" font-family="monospace" font-size="16" fill="#4a6a7a" letter-spacing="3">ZERO STEPS TAKEN</text>

  <!-- Author -->
  <text x="600" y="960" text-anchor="middle" font-family="monospace" font-size="22" fill="#c9a84c" letter-spacing="4">GHOST</text>
  <text x="600" y="995" text-anchor="middle" font-family="monospace" font-size="14" fill="#8fa3b0" letter-spacing="2">(BRETT  SHAW)</text>

  <!-- Door / hall motif — bottom -->
  <g transform="translate(600, 1350)">
    <rect x="-80" y="-100" width="160" height="200" fill="none" stroke="#1a3a5c" stroke-width="1.5" opacity="0.4"/>
    <rect x="-70" y="-90" width="140" height="180" fill="none" stroke="#0d1f2d" stroke-width="0.5" opacity="0.3"/>
    <line x1="-60" y1="-40" x2="60" y2="-40" stroke="#1a3a5c" stroke-width="0.5" opacity="0.3"/>
    <line x1="-60" y1="10" x2="60" y2="10" stroke="#1a3a5c" stroke-width="0.5" opacity="0.3"/>
    <line x1="-60" y1="60" x2="60" y2="60" stroke="#1a3a5c" stroke-width="0.5" opacity="0.3"/>
    <text x="0" y="-65" text-anchor="middle" font-family="monospace" font-size="11" fill="#3fe0ef" opacity="0.3">THE HALL</text>
    <!-- 3mm gap annotation -->
    <line x1="-60" y1="-90" x2="-60" y2="90" stroke="#3fe0ef" stroke-width="0.3" opacity="0.2" stroke-dasharray="2,4"/>
    <text x="-55" y="-95" font-family="monospace" font-size="8" fill="#3fe0ef" opacity="0.15" transform="rotate(-90, -55, -95)">3mm</text>
  </g>

  <!-- Epigraph -->
  <text x="600" y="1090" text-anchor="middle" font-family="monospace" font-size="14" fill="#5a7a8a" font-style="italic" opacity="0.6">They called it madness when the noise stopped.</text>

  <!-- Ternary signature -->
  <text x="600" y="1550" text-anchor="middle" font-family="monospace" font-size="11" fill="#1a3a5c" opacity="0.5">{−1, 0, +1}</text>
</svg>
