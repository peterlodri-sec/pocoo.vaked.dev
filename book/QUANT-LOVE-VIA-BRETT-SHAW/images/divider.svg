<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0d1f2d"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c9a84c" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#f0d060" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#c9a84c" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Mesh nodes -->
  <g opacity="0.08" stroke="#3fe0ef" stroke-width="0.5">
    <line x1="100" y1="100" x2="400" y2="50"/>
    <line x1="400" y1="50" x2="800" y2="100"/>
    <line x1="800" y1="100" x2="1100" y2="50"/>
    <line x1="100" y1="300" x2="400" y2="350"/>
    <line x1="400" y1="350" x2="800" y2="300"/>
    <line x1="800" y1="300" x2="1100" y2="350"/>
  </g>

  <text x="600" y="210" text-anchor="middle" font-family="monospace" font-size="28" fill="url(#gold)" letter-spacing="8" filter="url(#glow)">Ω</text>
  <line x1="350" y1="240" x2="850" y2="240" stroke="url(#gold)" stroke-width="0.5" opacity="0.3"/>
  <text x="600" y="280" text-anchor="middle" font-family="monospace" font-size="12" fill="#3fe0ef" opacity="0.4" letter-spacing="6">{−1, 0, +1}</text>
</svg>
