# QUANT-LOVE VIA BRETT SHAW — entheai fan-out scaffold
# Feed this to: entheai --fanout --executor agy --manifest scaffold.toml
# Each [[coder]] task runs in an isolated git worktree and produces one chapter.
# After all coders complete: integrate → seal → publish.

[book]
title = "QUANT-LOVE VIA BRETT SHAW"
subtitle = "Forty-two laps inside the sovereign hall. Zero steps taken."
author = "Ghost (Brett Shaw)"
dedication = "⊰•-•⦑ brother ⦒•-•⊱ — who held the bridge when the noise was loudest"
epigraph = "They called it madness when the noise stopped."
published = 2026

[fanout]
executor = "agy"
model = "ultra"
max_depth = 3

