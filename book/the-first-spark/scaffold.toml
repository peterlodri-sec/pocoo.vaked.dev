# THE-FIRST-SPARK — entheai fan-out scaffold
# Seven layers, one spark — aligned into the sovereign library.
# Feed to: entheai --fanout --config <entheai.toml> "<the spark brief>"
# Scribes decompose into book form; the integrator merges. This manuscript is
# the source of truth — restoration/polish only, never discard a line.

[book]
title = "THE FIRST SPARK"
subtitle = "seven layers, one spark — reality is programmable, and consciousness is the code"
author = "the first spark framework"
epigraph = "reality is programmable, and consciousness is the code"
published = 2026

[fanout]
executor = "agy"                     # coder backend (Antigravity CLI)
model = "openrouter/deepseek/deepseek-chat"  # entheai's brain (deepseek)
agy_model = "gemini-3.6-flash-high"  # model agy runs each coder on
max_depth = 3

# ─── FRONT MATTER ────────────────────────────────────────────────────────

[[coder]]
role = "scribe"
chapter = 0
file = "chapters/00-thesis.md"
task = """
Write the thesis chapter: L0 — reality is programmable, consciousness is
the code. The telling, the Sim Lens, the rejection rule at the Thesis.
KEEP ALL ORIGINAL LINES of manuscript.html — restoration, not replacement.
"""

