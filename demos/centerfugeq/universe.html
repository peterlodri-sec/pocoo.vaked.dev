 else if(kind==='impact'){if(tt>5){for(let r2=1;r2<=4;r2++){X.strokeStyle='rgba(255,110,199,'+(1-r2*.2)+')';X.beginPath();X.arc(cx,cy,r2*12+(tt-5)*22,0,TAU);X.stroke()}
  glowDot(cx,cy,Math.min(W,H)*.16,'rgba(255,211,110,.8)','rgba(255,211,110,0)')}
  else{X.fillStyle='#b48bc0';X.beginPath();X.arc(cx+tt*30,cy+tt*7.5,6,0,TAU);X.fill();
  X.strokeStyle='rgba(180,139,192,.5)';X.beginPath();X.moveTo(cx+tt*30-14,cy+tt*7.5);X.lineTo(cx+tt*30-40,cy+tt*7.5-14);X.stroke()}}
 else if(kind==='jets'){for(let i=0;i<2;i++){const a=Math.PI/2*i+Math.sin(tt*.4)*.5;X.strokeStyle='rgba(98,230,201,.5)';X.lineWidth=2.4;X.beginPath();X.moveTo(cx,cy);X.lineTo(cx+Math.cos(a)*Math.min(W,H)*.4,cy+Math.sin(a)*Math.min(W,H)*.4);X.stroke()}
  X.fillStyle='#fff';X.beginPath();X.arc(cx,cy,6+3*Math.sin(tt*9),0,TAU);X.fill()}
 else if(kind==='condense'){const rr=(Math.min(W,H)*.4*zoom)*(1-Math.min(.6,tt*.01));X.strokeStyle='rgba(255,154,213,.4)';X.lineWidth=1.4;X.beginPath();X.arc(cx,cy,rr,0,TAU);X.stroke();
  X.fillStyle='#ffd36e';X.font='10px ui-monospace';X.fillText(Math.min(99,EV.t*3|0)+' stars frozen',cx-40,cy+rr+16)}
 else if(kind==='fold'){X.strokeStyle='rgba(180,139,255,.5)';X.lineWidth=1.6;
  for(let f=0;f<4;f++){X.beginPath();for(let i=0;i<=40;i++){const a=i/40*TAU;const r=(30+f*18)*(1+.2*Math.sin(a*3+f*2+tt*2.2));X.lineTo(cx+Math.cos(a+r*.05)*r/1.6,cy+Math.sin(a+r*.05)*r/1.9)}X.stroke()}}
 else{X.strokeStyle='rgba(255,154,213,.35)';for(let i=0;i<3;i++){X.beginPath();X.ellipse(cx,cy,(30+i*16)*(1+Math.sin(tt*.5+i)*.1),(20+i*12)*(1+Math.cos(tt*.4+i)*.1),0,0,TAU);X.stroke()}}
 X.font='13px ui-monospace';X.fillStyle='#ff9ad5';X.fillText(prompt,cx-160,cy-Math.min(W,H)*.4*zoom-10);
 X.fillStyle='#62e6c9';X.font='9px ui-monospace';
 X.fillText('class: '+kind+' · seed 0x'+EV.seed.toString(16).toUpperCase()+' · retype to replay · T='+tRel.toFixed(3),cx-170,cy+Math.min(W,H)*.4*zoom+22)}
O('⚡ EVENT SIMULATOR','event','any',.5,.5,.5,'type any galactic event below — the prompt is the physics');
// ══ main ══
const KEYS={};addEventListener('keydown',e=>{KEYS[e.key.toLowerCase()]=1;
 if(e.key==='/'){e.preventDefault();document.getElementById('q').focus()}
 if(e.key==='Escape')home();
 if(e.key==='t'||e.key==='T')document.getElementById('speed').onclick();
 if('wasd +-'.includes(e.key.toLowerCase()+' '))e.preventDefault()});
addEventListener('keyup',e=>{KEYS[e.key.toLowerCase()]=0});
document.getElementById('ev').addEventListener('keydown',e=>{if(e.key==='Enter'){const v=e.target.value.trim();if(v){EV=null;travel({name:v,type:'event',cat:'any',z:.8,desc:'the prompt is the physics'});}}});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value;list(filter())});
function list(items){const lst=document.getElementById('lst');lst.innerHTML='';for(const o of items){const d=document.createElement('div');d.className='o'+(sel===o.name?' on':'');d.innerHTML='<b>'+o.name+'</b><span>'+o.type+' · '+o.desc.slice(0,42)+'</span>';d.onclick=()=>travel(o);lst.appendChild(d)}}
function loop(){const now=performance.now()/1000,dt=Math.min(now-tAbs,.05);tAbs=now;
 tRel+=dt*Math.max(scale||0)/T_YEAR;
 // glide toward target
 const kt=Math.min(1,(tv+=dt*1.6));camX+=(TX-camX)*(kt*(2-kt));camY+=(TY-camY)*(kt*(2-kt));zoom+=(TZ-zoom)*(kt*(2-kt));
 const sp=260*dt/zoom;camX+=(KEYS['d']?sp:0)-(KEYS['a']?sp:0);camY+=(KEYS['s']?sp:0)-(KEYS['w']?sp:0);
 if(KEYS['+']||KEYS['='])zoom=Math.min(8,zoom*1.02);if(KEYS['-'])zoom=Math.max(.3,zoom*.98);
 if(!sel)viewUniverse(dt);else if(sel.type==='event')viewEvent(dt,sel.name);
 else{
  const t2=sel.type;
  if(t2==='home')viewOrbit(1,sel.name,sel.desc);
  else if(t2==='star')ringView('core',1,sel.name,sel.desc);
  else if(t2==='exo')ringView('core',.8,sel.name,sel.desc);
  else if(t2==='galaxy')ringView('core',1.2,sel.name,sel.desc);
  else if(t2==='hole')ringView('hole',1,sel.name,sel.desc);
  else if(t2==='quasar')ringView('quasar',1,sel.name,sel.desc);
  else if(t2==='magnetar')ringView('magnetar',1,sel.name,sel.desc);
  else if(t2==='pulsar')ringView('pulsar',1,sel.name,sel.desc);
  else if(t2==='nebula')viewNebula(sel.desc);
  else if(t2==='cluster')viewCluster(sel.desc);
  else if(t2==='lens')viewLens(sel.desc);
  else if(t2==='void'||t2==='wall'||t2==='grid')viewGrid(sel.desc,t2);
  else if(t2==='dwarf')viewDwarf(sel.desc);
  else if(t2==='belt')ringView('core',1.4,sel.name,sel.desc);
  else if(t2==='comet')viewProbe(sel.desc+' · the tail follows');
  else if(t2==='probe')viewProbe(sel.desc);
  else if(t2==='res_cmb')viewCmb(sel.desc);
  else if(t2==='res_mp')viewMp(sel.desc);
  else if(t2==='res_k')viewK(sel.desc);
  else if(t2==='res_sr')viewSr(sel.desc);
  else if(t2==='res_clio')viewClio(sel.desc);
  else if(t2==='res_rsvp')viewRsvp(sel.desc);
  else if(t2==='res_axq')viewAcademy(sel.desc);
  else if(t2==='res_cag')viewCag(sel.desc);
  else viewUniverse(dt)}
 // HUD
 X.fillStyle='rgba(5,2,8,.8)';X.fillRect(0,0,W,26);X.fillRect(0,H-24,W,24);
 X.fillStyle='#ff9ad5';X.font='11px ui-monospace';X.fillText('UNIVERSE v3 · '+CAT.length+' objects · seed '+seed.toString(16).toUpperCase(),12,17);
 X.fillStyle='#ffd36e';X.fillText('T = '+tRel.toFixed(4)+' yr (origo Earth·Sun) · ×'+(scale||'∞')+' · / search · esc home',W-470,17);
 X.fillStyle='#62e6c9';X.font='10px ui-monospace';X.fillText('the catalog is the sky, the papers are the floor — the constellation',12,H-8);
 const tick=document.getElementById('tick');
 if(now-(window._ev||0)>5){window._ev=now;tick.textContent='⟦ '+CAT[Math.floor(now/5)%CAT.length].name+' · the constellation ⟧'}
 requestAnimationFrame(loop)}
document.getElementById('boot').onclick=()=>{menu();list(filter());document.getElementById('boot').remove();tAbs=performance.now()/1000;requestAnimationFrame(loop)};
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;c.width=W;c.height=H});
menu();list(filter());
