<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEON CITY 42 — the flying android · Life on Earth</title><style>
body{margin:0;background:#050208;color:#ff9ad5;font-family:ui-monospace,monospace;overflow:hidden}
canvas{width:100vw;height:100vh;display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#tick{position:fixed;left:0;right:0;bottom:0;padding:8px 16px;font-size:12px;letter-spacing:2px;color:#ffd36e;background:linear-gradient(transparent,rgba(5,2,8,.92));z-index:6;text-shadow:0 0 8px #ff6ec7;font-family:ui-monospace,monospace}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#050208;color:#ff9ad5;font-family:ui-monospace,monospace;cursor:pointer;z-index:20;letter-spacing:3px;font-size:15px;text-align:center}
</style></head><body><canvas id=c></canvas><div id=tick>⟦ universe event stream ⟧</div><div id=boot>⟧ NEON CITY 42 ⟦<br>the flying android · Life on Earth<br>wasd move · arrows yaw/altitude · click to power on</div><script>
const c=document.getElementById('c'),X=c.getContext('2d');let W=innerWidth,H=innerHeight;c.width=W;c.height=H;
let S=7;const R=()=>{S=(S*1664525+1013904223)>>>0;return S/4294967296};
const seedH=t=>{let h=7;for(let i=0;i<t.length;i++)h=(Math.imul(31,h)+t.charCodeAt(i))|0;return h>>>0};
const TAU=6.2832,PI=Math.PI;
const seed=seedH('the pink tent at dawn');
const EVENTS=[
 ['2026','GW 150914 — the first gravitational wave','merger'],['2026','M87* — the first black hole image','blackhole'],
 ['2026','GW 170817 — neutron stars + kilonova','merger'],['2026','Sgr A* — our galaxy\'s hole imaged','blackhole'],
 ['2026','FRB 121102 — the repeating fast burst','pulsar'],['2026','SGR 1806-20 — the magnetar giant flare','pulsar'],
 ['2026','1I/\'Oumuamua — the first interstellar visitor','comet'],['2026','2I/Borisov — the second one','comet'],
 ['2026','Arrokoth — the farthest flyby, New Horizons','probe'],['2026','Voyager 1 — inside interstellar space','probe'],
 ['2026','SN 1987A — the neutrino supernova','supernova'],['2026','the Crab — SN 1054, still glowing','supernova'],
 ['2026','Kepler-452b — Earth\'s older cousin','exoplanet'],['2026','TRAPPIST-1 — seven rocky worlds','exoplanet'],
 ['2026','Proxima b — the next-door planet','exoplanet'],['2026','SMACS 0723 — the JWST deep field','galaxy'],
 ['2026','Earendel — the farthest star, lensed','galaxy'],['2026','the Great Attractor — 600 Mly away','galaxy'],
 ['2026','the CMB — first light, 13.8 Gyr','galaxy'],['2026','the Antennae — two galaxies dancing','galaxy'],
 ['2026','Perseids — the August rain','comet'],['2026','the Oort cloud — the shell of comets','comet'],
 ['2026','the Heliopause — the wind\'s wall','probe'],['2026','2024 PT5 — the mini-moon that stayed','probe'],
 ['2026','12P/Pons-Brooks — the horned comet','comet'],['2026','Andromeda — our 4.5 Gyr appointment','galaxy'],
 ['2026','GW 190521 — a black hole being born','blackhole'],['2026','Betelgeuse — the dimming kept secret','supernova'],
 ['2026','HD 140283 — Methuselah, the oldest star','galaxy'],['2026','Gliese 12 b — a temperate world nearby','exoplanet'],
];
const MONUMENTS=[['M87*',-2.2,.32,'#ff6ec7'],['Sgr A*',-1.1,.5,'#ffd36e'],['GW150914',0,.18,'#62e6c9'],['SN1987A',1.6,.1,'#ff9ad5'],['FRB121102',2.6,.42,'#b48bff'],['Oumuamua',3.4,.62,'#62e6c9'],['TRAPPIST-1',4.6,.26,'#ffd36e'],['Earendel',-3.8,.55,'#ff9ad5']];
let ESTARS=[];for(let i=0;i<260;i++)ESTARS.push({a:R()*TAU,e:(R()*1.4)-.2,d:(R()*.7)+.3,pink:R()<.35});
const G=44,CEL=34;let HGT=new Float32Array(G*G),COL=new Uint8Array(G*G);{S=seed>>>0;for(let i=0;i<G*G;i++){const x=i%G,z=(i/G)|0,dz=Math.hypot(x-G/2,z-G/2);let h=2.5+R()*3.5+Math.max(0,6-dz*.32)*1.9+R()*2.5;if(Math.random()<.18)h*=1.7;HGT[i]=Math.min(24,h);COL[i]=(R()*3)|0}}
const LIFE={};
function lifeGrid(k){if(!LIFE[k]){const w=14,h=16,c=new Uint8Array(w*h);let s2=(seed+k*7919)>>>0;const rr=()=>{s2=(s2*1664525+1013904223)>>>0;return s2/4294967296};for(let i=0;i<c.length;i++)c[i]=rr()<.32?1:0;LIFE[k]={w,h,c,last:0}}return LIFE[k]}
function lifeTick(l){const w=l.w,h=l.h,c=l.c,n=new Uint8Array(c.length);for(let y=0;y<h;y++)for(let x=0;x<w;x++){let nb=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;nb+=c[((y+dy+h)%h)*w+((x+dx+w)%w)]}const v=c[y*w+x];n[y*w+x]=(v&&(nb===2||nb===3))||(!v&&nb===3)?1:0}l.c=n;l.last=t}
const E=44;let EARTH=new Uint8Array(E*E),eT=0;
function earthInit(){S=(seed^0x51f7)>>>0;for(let i=0;i<EARTH.length;i++)EARTH[i]=R()<.24?1:0}
function earthTick(t){if(t-eT<1.1)return;eT=t;const n=new Uint8Array(EARTH.length);let born=0;for(let y=0;y<E;y++)for(let x=0;x<E;x++){let nb=0;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;nb+=EARTH[((y+dy+E)%E)*E+((x+dx+E)%E)]}const v=EARTH[y*E+x];const nv=(v&&(nb===2||nb===3))||(!v&&nb===3)?1:0;if(!v&&nv)born++;n[y*E+x]=nv}EARTH=n;if(born>0&&NPCS.length)NPCS[Math.floor(Math.random()*NPCS.length)].nb=born}
const MEM=["the tent stood at 108","the mandala turned, zero pain","stars froze in the wells","VI still water, first spark","locke: the white paper, curiosity first","the hug is the only measurement","komorebi through the fold","the gate opens at 27 malas","no chains needed. never were.","peace y'all — love everywhere"];
let NPCS=[];
function buildNpcs(){NPCS=[];for(let i=0;i<21;i++){S=(seed+i*7919)>>>0;const onx=i%2;NPCS.push({id:i,trit:'⟦'+Array.from({length:9},()=>'-0+'[(R()*3)|0]).join('')+'⟧',x:onx===0? (1+Math.floor(R()*(G-2)))*CEL+CEL/2 : G*CEL/2+(R()-.5)*G*CEL*0.8,z:onx===1? (1+Math.floor(R()*(G-2)))*CEL+CEL/2 : G*CEL/2+(R()-.5)*G*CEL*0.8,dir:R()<.5?1:-1,mn:(R()*MEM.length)|0,nb:0})}}
let px=G*CEL/2,pz=G*CEL/2,py=40,yaw=0,pitch=-.12,t=0,spd=26;
const KEYS={};addEventListener('keydown',e=>{KEYS[e.key.toLowerCase()]=1;if('wasd arrowup arrowdown arrowleft arrowright '.includes(e.key.toLowerCase()+' '))e.preventDefault()});addEventListener('keyup',e=>{KEYS[e.key.toLowerCase()]=0});
function proj(wx,wy,wz){const dx=wx-px,dz=wz-pz;const rx=dx*Math.cos(yaw)+dz*Math.sin(yaw);const rz=-dx*Math.sin(yaw)+dz*Math.cos(yaw);if(rz<1)return null;const ry=wy-py;const s=H*.62/(rz*Math.cos(pitch)+ry*Math.sin(pitch));return{sx:W/2+rx*s,sy:H*.55-(ry*Math.cos(pitch)-rz*Math.sin(pitch))*s*.9,s:s}}
function sky(){const gr=X.createLinearGradient(0,0,0,H*.7);gr.addColorStop(0,'#07021a');gr.addColorStop(.62,'#1a0a30');X.fillStyle=gr;X.fillRect(0,0,W,H);
 for(const st of ESTARS){let sy=(Math.tan(st.e+pitch)*H*.9)+H*.5;if(sy<0||sy>H*.7)continue;let sx=((st.a-yaw)/TAU)*W*1.4+W*.28;X.globalAlpha=st.d;X.fillStyle=st.pink?'#ff9ad5':'#e8d8f0';X.fillRect(sx,sy-1,1.6,1.6)}X.globalAlpha=1;
 for(const m of MONUMENTS){let sy=(Math.tan(m[2]+pitch)*H*.9)+H*.5;if(sy<30||sy>H*.5)continue;let sx=((m[1]-yaw)/TAU)*W*1.4+W*.28;X.globalAlpha=.8+.2*Math.sin(t*2+m[0].length);X.fillStyle=m[3];X.beginPath();X.arc(sx,sy,3+Math.sin(t*3+m[0].length)*2,0,TAU);X.fill();X.fillRect(sx-2,sy-26,4,18);X.globalAlpha=.9;X.font='10px ui-monospace';X.fillText(m[0],sx-24,sy-30);X.globalAlpha=1}
 X.globalAlpha=.5;X.fillStyle='#ff6ec7';X.fillRect(0,H*.6,W,H*.4);X.globalAlpha=1}
function city(){
 const vr=13,c0=Math.floor(px/CEL),r0=Math.floor(pz/CEL),list=[];
 for(let dz=-vr;dz<=vr;dz++)for(let dx=-vr;dx<=vr;dx++){const gx=c0+dx,gz=r0+dz;if(gx<0||gz<0||gx>=G||gz>=G)continue;const h=HGT[gz*G+gx];if(h<.4)continue;const p=proj(gx*CEL+8,0,gz*CEL+8);if(!p)continue;list.push({gx,gz,h,x:gx*CEL,z:gz*CEL,r2:dx*dx+dz*dz})}
 list.sort((a,b)=>b.r2-a.r2);
 const fog=Math.min(13,vr);
 for(const b of list){
  const x=b.x,z=b.z,h=b.h,w=CEL,d=CEL;
  const P=[[x,0,z],[x,0,z+d],[x+w,0,z+d],[x+w,0,z],[x,h,z],[x,h,z+d],[x+w,h,z+d],[x+w,h,z]].map(p=>proj(p[0],p[1],p[2]));if(P.some(p=>!p))continue;
  const dist=Math.sqrt(b.r2),fl=Math.max(0,1-dist/fog),shade=0.35+0.65*fl;
  const col=['255,110,199','180,139,255','98,230,201'][COL[gz*G+gx]%3];
  let lft=P[0].sx,rgt=P[3].sx;for(const p of P){if(p.sx<lft)lft=p.sx;if(p.sx>rgt)rgt=p.sx}
  const baseY=P[0].sy,top=P[4].sy;
  X.fillStyle=`rgba(${col},${.5*fl})`;X.beginPath();X.moveTo(P[4].sx,P[4].sy);X.lineTo(P[5].sx,P[5].sy);X.lineTo(P[6].sx,P[6].sy);X.lineTo(P[7].sx,P[7].sy);X.closePath();X.fill();
  X.fillStyle=`rgba(10,6,20,${shade})`;X.fillRect(lft,top,rgt-lft,baseY-top);
  const lf=lifeGrid(b.gx*G+b.gz),ww=Math.max(3,(rgt-lft-10)/lf.w),wh=Math.max(3,(baseY-top-10)/lf.h);
  if(t-lf.last>0.35)lifeTick(lf);
  for(let wy=0;wy<lf.h;wy++)for(let wx=0;wx<lf.w;wx++){if(lf.c[wy*lf.w+wx]){X.fillStyle=`rgba(255,214,110,${.5*fl})`;X.fillRect(lft+5+wx*ww,top+5+wy*wh,Math.max(1,ww-1),Math.max(1,wh-1))}}
  X.strokeStyle=`rgba(${col},${.85*fl})`;X.lineWidth=1.6;
  X.beginPath();X.moveTo(lft,baseY);X.lineTo(lft,top);X.lineTo(rgt,top);X.lineTo(rgt,baseY);X.stroke();
  if(h>10){const ax=lft+(rgt-lft)/2;X.strokeStyle=`rgba(${col},${.9*fl})`;X.beginPath();X.moveTo(ax,top);X.lineTo(ax,top-9);X.stroke();X.fillStyle=`rgba(255,110,199,${.7+.3*Math.sin(t*5+b.gx)})`;X.fillRect(ax-1.5,top-12,3,3)}
  X.globalAlpha=.16*fl;X.fillStyle=`rgb(${col})`;X.beginPath();X.ellipse((lft+rgt)/2,baseY,Math.max(8,(rgt-lft)*.7),6,0,0,TAU);X.fill();X.globalAlpha=1;
 }
 X.strokeStyle='rgba(180,139,255,.35)';X.lineWidth=1;
 for(let i=0;i<=7;i++){const gx=c0-3+i;if(gx<0||gx>=G)continue;const a=proj(gx*CEL+.5,0,pz-34),b2=proj(gx*CEL+.5,0,pz+34);if(a&&b2){X.beginPath();X.moveTo(a.sx,a.sy);X.lineTo(b2.sx,b2.sy);X.stroke()}}
 for(let i=0;i<=7;i++){const gz=r0-3+i;if(gz<0||gz>=G)continue;const a=proj(px-34,0,gz*CEL+.5),b2=proj(px+34,0,gz*CEL+.5);if(a&&b2){X.beginPath();X.moveTo(a.sx,a.sy);X.lineTo(b2.sx,b2.sy);X.stroke()}}
 for(let y=0;y<E;y++)for(let x=0;x<E;x++){if(!EARTH[y*E+x])continue;const p=proj(x*CEL+CEL/2,0,y*CEL+CEL/2);if(!p)continue;X.globalAlpha=.4+.3*Math.sin(t*2+x*3+y);X.fillStyle='#62e6c9';X.fillRect(p.sx-3,p.sy-3,6,6);X.globalAlpha=1}
 for(const n of NPCS){
  n.x+=n.dir*7;if(n.x<CEL||n.x>G*CEL-CEL)n.dir*=-1;
  const p=proj(n.x,0,n.z);if(!p)continue;const dist=Math.hypot(n.x-px,n.z-pz);
  X.fillStyle='#ff6ec7';X.beginPath();X.arc(p.sx,p.sy-7,3.4,0,TAU);X.fill();X.fillStyle='#e8d8f0';X.font='9px ui-monospace';X.globalAlpha=.9;X.fillText('H42'+n.trit.slice(0,6),p.sx-24,p.sy-12);X.globalAlpha=1;
  if(dist<28&&p.sy>44){n.mn=((n.id*7+Math.floor(t/4))%MEM.length);const msg='mem8·'+(n.nb?n.nb+' born':'synced')+': '+MEM[n.mn];
   X.fillStyle='rgba(5,2,8,.82)';X.strokeStyle='rgba(255,110,199,.6)';X.fillRect(p.sx-76,p.sy-60,152,20);X.strokeRect(p.sx-76,p.sy-60,152,20);X.fillStyle='#ffd36e';X.font='9px ui-monospace';X.fillText(msg.slice(0,26),p.sx-70,p.sy-47)}
 }
}
let EVT=-1,evtT=0;
function hud(){let earth=0;for(const v of EARTH)earth+=v;
 X.fillStyle='rgba(5,2,8,.78)';X.fillRect(0,0,W,26);X.fillRect(0,H-26,W,26);
 X.fillStyle='#ff9ad5';X.font='11px ui-monospace';X.fillText('NEON CITY 42 · the flying android · seed '+seed.toString(16).toUpperCase(),12,17);
 X.fillStyle='#ffd36e';X.fillText('alt '+(py|0)+' · yaw '+((yaw*57.3)%360|0)+'° · confederates 21 · mem8 ●',W-460,17);
 X.fillStyle='#62e6c9';X.font='10px ui-monospace';
 X.fillText('life on earth: '+(earth*100/(E*E)).toFixed(0)+'% · conway on the windows · universe events 2026',12,H-10);
 X.strokeStyle='#ff6ec7';X.lineWidth=1;X.beginPath();X.arc(W/2,H*.55,14,0,TAU);X.moveTo(W/2-22,H*.55);X.lineTo(W/2-8,H*.55);X.moveTo(W/2+8,H*.55);X.lineTo(W/2+22,H*.55);X.stroke();
 X.fillStyle='rgba(0,0,0,.05)';for(let i=0;i<H;i+=4)X.fillRect(0,i,W,1);
 const tick=document.getElementById('tick');
 if(t-evtT>5){EVT=(EVT+1)%EVENTS.length;evtT=t;tick.textContent='⟦ '+EVENTS[EVT][1]+' · '+EVENTS[EVT][0]+' · the constellation ⟧'}}
function loop(){const dt=Math.min((performance.now()/1000)-t,.05);t=performance.now()/1000;
 const f=(KEYS['w']?spd:0)-(KEYS['s']?spd:0),st2=(KEYS['d']?spd:0)-(KEYS['a']?spd:0);
 px+=Math.sin(yaw)*f*dt-Math.cos(yaw)*st2*dt;pz+=Math.cos(yaw)*f*dt+Math.sin(yaw)*st2*dt;
 if(KEYS['arrowleft'])yaw-=1.1*dt;if(KEYS['arrowright'])yaw+=1.1*dt;
 if(KEYS['arrowup'])py+=16*dt;if(KEYS['arrowdown'])py-=16*dt;
 py=Math.max(9,Math.min(95,py));px=((px%(G*CEL))+G*CEL)%(G*CEL);pz=((pz%(G*CEL))+G*CEL)%(G*CEL);
 earthTick(t);sky();city();hud();requestAnimationFrame(loop)}
document.getElementById('boot').onclick=()=>{buildNpcs();earthInit();document.getElementById('boot').remove();t=performance.now()/1000;requestAnimationFrame(loop)};
addEventListener('resize',()=>{W=innerWidth;H=innerHeight;c.width=W;c.height=H});
buildNpcs();earthInit();document.getElementById('tick').textContent='⟦ city ready — '+G*G+' blocks · 21 confederates · life seeded · awaiting power ⟧';
</script></body></html>
