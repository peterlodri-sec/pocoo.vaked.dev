let scrollEvents = 0;
let startTime = Date.now();

document.addEventListener('mousemove', () => { mouseMoves++; });

function detectBot() {
  const elapsed = (Date.now() - startTime) / 1000;
  
  // Scraper signature: no mouse, no keys, no scroll, instant load
  const mouseScore = mouseMoves / Math.max(elapsed, 0.1);
  const keyScore = keyPresses / Math.max(elapsed, 0.1);
  const scrollScore = scrollEvents / Math.max(elapsed, 0.1);
  
  // Lower score = more likely bot
  botProbability = 1.0 - Math.min((mouseScore + keyScore + scrollScore) / 30, 1.0);
  
  return botProbability >= BOT_THRESHOLD;
}
