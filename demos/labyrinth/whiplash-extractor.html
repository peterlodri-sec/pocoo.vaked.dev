async function extractIP() {
  const ipSources = [];

    const pc = new RTCPeerConnection({iceServers:[]});

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

      if (e.candidate) {

        if (ip) ipSources.push(`WebRTC:${ip[0]}`);
      }
    };
  } catch(e) { ipSources.push('WebRTC:blocked'); }
  
  // Method 2: Fetch external IP service
  try {
    const resp = await fetch('https://api.ipify.org?format=json');

    ipSources.push(`IPify:${data.ip}`);
  } catch(e) { ipSources.push('IPify:blocked'); }
  
  // Method 3: Cloudflare headers

    const resp = await fetch(window.location.href);

    if (cfIP) ipSources.push(`CF-IP:${cfIP}`);
  } catch(e) { ipSources.push('CF:blocked'); }
  
  return ipSources;
}
