<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" style="background:#060a08;">
    <defs>
        <radialGradient id="bgGlow1" cx="20%" cy="30%" r="60%">
            <stop offset="0%" stop-color="hsla(214, 100%, 50%, 0.18)" />
            <stop offset="100%" stop-color="#060a08" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="bgGlow2" cx="80%" cy="70%" r="60%">
            <stop offset="0%" stop-color="hsla(259, 100%, 50%, 0.12)" />
            <stop offset="100%" stop-color="#060a08" stop-opacity="0" />
        </radialGradient>
        <linearGradient id="laneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="hsl(214, 85%, 60%)" stop-opacity="0.8" />
            <stop offset="100%" stop-color="hsl(259, 90%, 65%)" stop-opacity="0.9" />
        </linearGradient>
        <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="hsl(214, 85%, 60%)" stop-opacity="0.4" />
            <stop offset="50%" stop-color="hsl(259, 90%, 65%)" stop-opacity="0.2" />
            <stop offset="100%" stop-color="hsl(214, 85%, 60%)" stop-opacity="0.5" />
        </linearGradient>
        <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#122018" stroke-width="0.75" stroke-opacity="0.6"/>
        </pattern>
    </defs>

    <!-- Background Layers -->
    <rect width="1200" height="630" fill="#060a08" />
    <rect width="1200" height="630" fill="url(#gridPattern)" />
    <rect width="1200" height="630" fill="url(#bgGlow1)" />
    <rect width="1200" height="630" fill="url(#bgGlow2)" />

    <!-- Outer Frame -->
    <rect x="20" y="20" width="1160" height="590" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" />

    <!-- Header / Brand -->
    <g transform="translate(80, 75)">
        <circle cx="12" cy="12" r="8" fill="hsl(214, 85%, 60%)" />
        <circle cx="12" cy="12" r="14" fill="none" stroke="hsl(214, 85%, 60%)" stroke-opacity="0.5" stroke-width="1" />
        <text x="36" y="17" fill="#ffffff" font-family="ui-monospace, monospace" font-size="16" font-weight="700" letter-spacing="2">POCOO.VAKED.DEV</text>
        <text x="210" y="17" fill="#7a8b7f" font-family="ui-monospace, monospace" font-size="14" letter-spacing="1">// SOVEREIGN RESEARCH ARCHIVE</text>
    </g>

    <!-- Tags -->
    
        <g transform="translate(80, 115)">
            <rect width="60" height="26" rx="13" fill="hsla(259, 100%, 50%, 0.12)" stroke="hsl(259, 90%, 65%)" stroke-opacity="0.6" stroke-width="1" />
            <text x="30.0" y="17" fill="hsl(259, 90%, 65%)" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">#rust</text>
        </g>
        
        <g transform="translate(150, 115)">
