            <text x="42.0" y="17" fill="hsl(259, 90%, 65%)" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">#assembly</text>
        </g>
        

    <!-- Title & Desc Block -->
    <g>
        <text x="80" y="175" fill="#ffffff" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="0.5" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.8))">Nuresh v0.2.0: 47.8 GB/s</text>
<text x="80" y="231" fill="#ffffff" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="0.5" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.8))">Bare-Metal ARM64 NEON Assembly</text>
<text x="80" y="287" fill="#ffffff" font-family="Georgia, serif" font-size="44" font-weight="700" letter-spacing="0.5" filter="drop-shadow(0 2px 10px rgba(0,0,0,0.8))">for Nushell</text>
        <text x="80" y="358" fill="#a3b8ab" font-family="ui-monospace, monospace" font-size="15" opacity="0.85">Inside nuresh v0.2.0: caller-saved ARM64 NEON</text>
<text x="80" y="382" fill="#a3b8ab" font-family="ui-monospace, monospace" font-size="15" opacity="0.85">inline assembly kernels hitting 47.80 GB/s dot...</text>
    </g>

    <!-- Graphic Motif (Right Side) -->
    <g><rect x="800" y="170" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="170" width="159.0" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="186" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 00</text><text x="1090" y="186" fill="hsl(214, 85%, 60%)" font-family="monospace" font-size="11">104 µs</text><rect x="800" y="206" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="206" width="175.5" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="222" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 01</text><text x="1090" y="222" fill="hsl(214, 85%, 60%)" font-family="monospace" font-size="11">148 µs</text><rect x="800" y="242" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="242" width="259.5" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="258" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 02</text><text x="1090" y="258" fill="hsl(214, 85%, 60%)" font-family="monospace" font-size="11">372 µs</text><rect x="800" y="278" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="278" width="213.0" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="294" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 03</text><text x="1090" y="294" fill="hsl(214, 85%, 60%)" font-family="monospace" font-size="11">248 µs</text><rect x="800" y="314" width="280" height="24" rx="4" fill="#0a1510" stroke="#1f3328" stroke-width="1" /><rect x="800" y="314" width="135.0" height="24" rx="4" fill="url(#laneGrad)" fill-opacity="0.8" /><text x="790" y="330" fill="#7a8b7f" font-family="monospace" font-size="11" text-anchor="end">LANE 04</text><text x="1090" y="330" fill="hsl(214, 8