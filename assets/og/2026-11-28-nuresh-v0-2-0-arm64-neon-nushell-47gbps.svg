            <text x="30.0" y="17" fill="hsl(259, 90%, 65%)" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">#arm64</text>
        </g>
        
        <g transform="translate(220, 115)">
            <rect width="60" height="26" rx="13" fill="hsla(259, 100%, 50%, 0.12)" stroke="hsl(259, 90%, 65%)" stroke-opacity="0.6" stroke-width="1" />
            <text x="30.0" y="17" fill="hsl(259, 90%, 65%)" font-family="ui-monospace, monospace" font-size="12" font-weight="600" text-anchor="middle">#neon</text>
        </g>
        
        <g transform="translate(290, 115)">
