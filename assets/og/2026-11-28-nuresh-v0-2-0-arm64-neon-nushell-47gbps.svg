        <text x="220" y="5" fill="#7a8b7f" font-family="ui-monospace, monospace" font-size="13">AUTHOR: PÉTER LODRI</text>
        <text x="520" y="5" fill="hsl(214, 85%, 60%)" font-family="ui-monospace, monospace" font-size="13" font-weight="600">HASH: #82c2ed32c998</text>
        <text x="1040" y="5" fill="hsl(259, 90%, 65%)" font-family="ui-monospace, monospace" font-size="13" font-weight="700" text-anchor="end">WE. {-1, 0, +1}. &lt;3</text>
