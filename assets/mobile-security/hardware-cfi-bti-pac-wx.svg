<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" role="img" aria-label="Hardware CFI Architecture: Android ARMv8.5-A BTI+PAC vs XNU arm64e W^X and SPTM">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101b"/>
      <stop offset="100%" stop-color="#11192a"/>
    </linearGradient>
    <linearGradient id="accentA" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentB" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <rect width="1120" height="620" rx="14" fill="url(#bg)"/>
  <rect x="20" y="20" width="1080" height="580" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <text x="48" y="64" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="700">Hardware CFI &amp; Page Protection Boundaries (2026 Empirical Audit)</text>
  <text x="48" y="90" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14">Pure-Rust ELF / Mach-O Auditing + Native ARM64 / arm64e Defensive Trace Trampolines (Zero RWX)</text>

  <!-- Left Panel: Android / Samsung SM-S928U1 -->
  <rect x="44" y="118" width="496" height="448" rx="10" fill="#0f172a" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="44" y="118" width="496" height="6" rx="3" fill="url(#accentA)"/>
  <text x="68" y="154" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700">Android ARM64 (SM-S928U1 · API 37)</text>
  <text x="68" y="176" fill="#94a3b8" font-family="ui-sans-serif, sans-serif" font-size="13">samsung-re audit-hardening · 8/8 KeyMint/RKP/Fabric ELFs</text>

  <rect x="68" y="196" width="448" height="72" rx="8" fill="#162033" stroke="#10b981" stroke-width="1.2"/>
  <text x="86" y="220" fill="#34d399" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">PT_LOAD: 16KB Alignment &amp; W^X Separation</text>
  <text x="86" y="241" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="12">min(p_align) = 0x4000 (8/8) · .note.android.pad_segment (8/8)</text>
  <text x="86" y="258" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">PF_W | PF_X violations: 0 · Full RELRO: 8/8</text>

  <rect x="68" y="284" width="448" height="84" rx="8" fill="#162033" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="86" y="308" fill="#38bdf8" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">.note.gnu.property (NT_GNU_PROPERTY_TYPE_0)</text>
  <text x="86" y="329" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="12">GNU_PROPERTY_AARCH64_FEATURE_1_AND = 0x3 (BTI | PAC)</text>
  <text x="86" y="348" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">Indirect calls require landing pad; LR authenticated on ret</text>

  <rect x="68" y="384" width="448" height="154" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.2"/>
  <text x="86" y="408" fill="#facc15" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">asm/aarch64_bti_pac_trace.S (d503245f / d503233f)</text>
  <text x="86" y="432" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">0x00: bti c                  // indirect BLR/BR landing pad</text>
  <text x="86" y="452" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">0x04: paciasp                // sign LR (x30) with SP via APIAKey</text>
  <text x="86" y="472" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">0x08: stp x29, x30, [sp, #-16]!</text>
  <text x="86" y="492" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">0x10: ldp x29, x30, [sp], #16</text>
  <text x="86" y="512" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">0x14: autiasp ; ret          // authenticate LR before return</text>

  <!-- Right Panel: Apple XNU arm64e iPhone14,3 -->
  <rect x="580" y="118" width="496" height="448" rx="10" fill="#0f172a" stroke="#3b275e" stroke-width="1.5"/>
  <rect x="580" y="118" width="496" height="6" rx="3" fill="url(#accentB)"/>
  <text x="604" y="154" fill="#c084fc" font-family="ui-monospace, Menlo, monospace" font-size="16" font-weight="700">Apple XNU arm64e (iPhone14,3 · 21D50)</text>
  <text x="604" y="176" fill="#94a3b8" font-family="ui-sans-serif, sans-serif" font-size="13">ios-re audit-wx · MH_FILESET + 241 embedded kexts (1,216 segs)</text>

  <rect x="604" y="196" width="448" height="72" rx="8" fill="#1b1530" stroke="#a855f7" stroke-width="1.2"/>
  <text x="622" y="220" fill="#d8b4fe" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">Strict Kernel W^X &amp; SPTM Page-Table Split</text>
  <text x="622" y="241" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="12">__TEXT_EXEC: r-x (0x2338000) · __DATA_CONST: r-- (0x48c000)</text>
  <text x="622" y="258" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">initprot / maxprot W^X violations: 0 top-level, 0 / 1,216 slices</text>

  <rect x="604" y="284" width="448" height="84" rx="8" fill="#1b1530" stroke="#ec4899" stroke-width="1.2"/>
  <text x="622" y="308" fill="#f472b6" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">__DATA_SPTM + XNU RELEASE_ARM64_T8110</text>
  <text x="622" y="329" fill="#e2e8f0" font-family="ui-monospace, Menlo, monospace" font-size="12">__DATA_SPTM @ 0xfffffff027d08000 (0x3c000, init r-- / max r--)</text>
  <text x="622" y="348" fill="#cbd5e1" font-family="ui-monospace, Menlo, monospace" font-size="12">Darwin Kernel Version 23.3.0 · xnu-10002.82.4~3 (arm64e)</text>

  <rect x="604" y="384" width="448" height="154" rx="8" fill="#090d16" stroke="#334155" stroke-width="1.2"/>
  <text x="622" y="408" fill="#f472b6" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">asm/arm64e_pac_trace.S (Mach-O __TEXT,__text)</text>
  <text x="622" y="432" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">0x00: paciasp                // Apple arm64e LR signing prologue</text>
  <text x="622" y="452" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">0x04: stp x29, x30, [sp, #-0x10]!</text>
  <text x="622" y="472" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">0x08: mov x29, sp            // read-only trace attribution slot</text>
  <text x="622" y="492" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">0x0c: ldp x29, x30, [sp], #0x10</text>
  <text x="622" y="512" fill="#94a3b8" font-family="ui-monospace, Menlo, monospace" font-size="12">0x10: autiasp ; ret          // verifies pointer signature pre-ret</text>
</svg>
