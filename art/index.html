<style>
:root {
  --bg: #0a0410;
  --fg: #c8b8d8;
  --pink: #ff69b4;
  --rose: #e07090;
  --purple: #a29bfe;
  --dark: #1a0a1a;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: ui-monospace, 'SF Mono', Menlo, monospace;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* header */
header {
  text-align: center;
  padding: 16px 12px 4px;
  border-bottom: 1px solid rgba(255,105,180,0.08);
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 10;
}
header h1 {
  font-size: 16px;
  color: var(--pink);
  letter-spacing: 4px;
  font-weight: 900;
}
header .sub {
  font-size: 10px;
  color: var(--pink);
  opacity: 0.3;
  letter-spacing: 2px;
  margin-top: 2px;
}

/* canvas area */
.canvas-wrap {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
}
canvas {
  border: 1px solid rgba(255,105,180,0.1);
  border-radius: 8px;
  cursor: crosshair;
  background: #0a0410;
  touch-action: none;
  max-width: 100%;
  max-height: 70vh;
}

/* tools */
.tools {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 12px;
  flex-wrap: wrap;
}
.tools button, .tools input[type=color], .tools input[type=range] {
  font-family: inherit;
  font-size: 10px;
  padding: 6px 12px;
  border: 1px solid rgba(255,105,180,0.2);
  background: rgba(255,105,180,0.04);
  color: var(--pink);
  border-radius: 4px;
  cursor: pointer;
  letter-spacing: 1px;
  transition: all .15s;
}
.tools button:hover, .tools input[type=color]:hover {
  background: rgba(255,105,180,0.12);
  border-color: var(--pink);
}
.tools .active { background: rgba(255,105,180,0.2); border-color: var(--pink); }
.tools input[type=color] { width: 32px; height: 32px; padding: 2px; }
.tools input[type=range] { width: 80px; accent-color: var(--pink); }

/* gallery */
.gallery {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}
.gallery h2 {
  text-align: center;
  font-size: 12px;
  color: var(--pink);
  opacity: 0.3;
  letter-spacing: 3px;
  margin-bottom: 16px;
}
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 12px;
}
.gallery-item {
  aspect-ratio: 1;
  border: 1px solid rgba(255,105,180,0.08);
  border-radius: 6px;
  overflow: hidden;
  cursor: pointer;
  transition: all .2s;
  position: relative;
}
.gallery-item:hover {
  border-color: var(--pink);
  transform: scale(1.03);
}
.gallery-item img {
  width: 100%; height: 100%; object-fit: cover;
}
.gallery-item .secret {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 6px;
  background: rgba(0,0,0,0.7);
  font-size: 8px;
  color: var(--pink);
  opacity: 0;
  transition: opacity .2s;
  text-align: center;
  letter-spacing: 1px;
}
.gallery-item:hover .secret { opacity: 1; }

/* secret input */
.secret-area {
  max-width: 500px;
  margin: 0 auto;
  padding: 0 20px 20px;
  text-align: center;
}
.secret-area textarea {
  width: 100%;
  background: rgba(255,105,180,0.04);
  border: 1px solid rgba(255,105,180,0.15);
  color: var(--fg);
  font-family: inherit;
  font-size: 11px;
  padding: 10px;
  border-radius: 6px;
  resize: vertical;
  min-height: 50px;
  letter-spacing: 1px;
}
.secret-area textarea:focus {
  outline: none;
  border-color: var(--pink);
}
.secret-area textarea::placeholder {
  color: rgba(255,105,180,0.2);
}

/* footer */
footer {
  text-align: center;
  padding: 30px 20px;
  font-size: 9px;
  opacity: 0.2;
  letter-spacing: 2px;
}
footer a { color: var(--pink); text-decoration: none; }

/* modal */
.modal {
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  cursor: pointer;
}
.modal img {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: 8px;
  border: 1px solid rgba(255,105,180,0.2);
}

/* on-chain layer */
.status-line {
  display: flex;
  justify-content: center;
  gap: 8px;
  padding: 8px 12px 12px;
  flex-wrap: wrap;
}
.chip {
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--pink);
  border: 1px solid rgba(255,105,180,0.15);
  border-radius: 999px;
  padding: 3px 10px;
  background: rgba(255,105,180,0.05);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip-dim { opacity: 0.5; }
.mint-badge {
  position: absolute;
  top: 4px; right: 4px;
  background: rgba(10,4,16,0.85);
  border: 1px solid rgba(255,105,180,0.4);
  color: var(--pink);
  font-size: 8px;
  letter-spacing: 1px;
  border-radius: 4px;
  padding: 2px 5px;
  pointer-events: none;
}
</style>

<header>
  <h1>🎀 art.vaked.dev</h1>
  <div class="sub">tell me a secret · i make you a painting</div>
  <div class="status-line">
    <span id="wallet-status" class="chip chip-dim">wallet: —</span>

<div class="canvas-wrap">

<div class="tools">
  <button id="brush-btn" class="active" onclick="setTool('brush')">🖌 brush</button>

  <input type="color" id="color-picker" value="#ff69b4" onchange="setColor(this.value)">

  <p style="margin-top:8px;color:var(--pink)">PEACE )( LOVE () UNITY &lt;3</p>

<script type="module" src="./chain.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let painting = false;
let tool = 'brush';
let color = '#ff69b4';
let size = 5;
let strokes = [];
let currentStroke = [];
let savedPaintings = JSON.parse(localStorage.getItem('art_vaked_gallery') || '[]');
let seededWorks = [
  { file: 'melting.png', secret: 'melting — for Chlo' },
  { file: 'nectar.png', secret: 'nectar — for Chlo' },
  { file: 'first-angel.png', secret: 'first angel — for Chlo' },
];

function setTool(t) {
  tool = t;
  document.querySelectorAll('.tools button').forEach(b => b.classList.remove('active'));
  document.getElementById(t + '-btn').classList.add('active');
}

function setColor(c) { color = c; }
function setSize(s) { size = parseInt(s); }

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top) * scaleY;
  return { x, y };
}

canvas.addEventListener('pointerdown', e => {
  painting = true;
  const { x, y } = getPos(e);
  currentStroke = [{ x, y, tool, color, size }];
  drawDot(x, y);
});

canvas.addEventListener('pointermove', e => {
  if (!painting) return;
  const { x, y } = getPos(e);
  currentStroke.push({ x, y, tool, color, size });
  drawSegment(currentStroke[currentStroke.length-2], { x, y });
});

canvas.addEventListener('pointerup', () => {
  if (!painting) return;
  painting = false;
  if (currentStroke.length > 0) strokes.push([...currentStroke]);
  currentStroke = [];
});

canvas.addEventListener('pointerleave', () => { painting = false; if (currentStroke.length > 0) strokes.push([...currentStroke]); currentStroke = []; });

function drawDot(x, y) {
  if (tool === 'spray') {
    for (let i = 0; i < size * 3; i++) {
      const sx = x + (Math.random() - 0.5) * size * 4;
      const sy = y + (Math.random() - 0.5) * size * 4;
      ctx.fillStyle = tool === 'eraser' ? '#0a0410' : color;
      ctx.globalAlpha = 0.3 + Math.random() * 0.4;
      ctx.beginPath(); ctx.arc(sx, sy, Math.random() * 2, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else {
    ctx.fillStyle = tool === 'eraser' ? '#0a0410' : color;
    ctx.beginPath(); ctx.arc(x, y, size/2, 0, Math.PI*2); ctx.fill();
  }
}

function drawSegment(from, to) {
  ctx.strokeStyle = tool === 'eraser' ? '#0a0410' : color;
  ctx.lineWidth = size;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(from.x, from.y);
  ctx.lineTo(to.x, to.y);
  ctx.stroke();
}

function clearCanvas() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  strokes = [];
}

function undoStroke() {
  strokes.pop();
  redraw();
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  strokes.forEach(stroke => {
    if (stroke.length === 1) {
      ctx.fillStyle = stroke[0].tool === 'eraser' ? '#0a0410' : stroke[0].color;
      ctx.beginPath(); ctx.arc(stroke[0].x, stroke[0].y, stroke[0].size/2, 0, Math.PI*2); ctx.fill();
    } else {
      for (let i = 1; i < stroke.length; i++) {
        ctx.strokeStyle = stroke[i].tool === 'eraser' ? '#0a0410' : stroke[i].color;
        ctx.lineWidth = stroke[i].size;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(stroke[i-1].x, stroke[i-1].y);
        ctx.lineTo(stroke[i].x, stroke[i].y);
        ctx.stroke();
      }
    }
  });
}

function savePainting() {
  const dataUrl = canvas.toDataURL('image/png');
  const secret = document.getElementById('secret-input').value || 'a secret untold';
  const painting = {
    id: Date.now(),
    dataUrl,
    secret,
    date: new Date().toISOString(),
    colors: [...new Set(strokes.flatMap(s => s.map(p => p.color)))].filter(c => c !== '#0a0410'),
  };
  savedPaintings.unshift(painting);
  if (savedPaintings.length > 42) savedPaintings = savedPaintings.slice(0, 42);
  localStorage.setItem('art_vaked_gallery', JSON.stringify(savedPaintings));
  document.getElementById('secret-input').value = '';
  renderGallery();
}

function renderGallery() {
  const grid = document.getElementById('gallery-grid');
  const seeded = seededWorks.map(p => `
    <div class="gallery-item" onclick="viewPainting('${p.file}')">
      <img src="${p.file}" alt="painting">
      <div class="secret">${p.secret}</div>
    </div>
  `).join('');
  const local = savedPaintings.map(p => `
    <div class="gallery-item" onclick="viewPainting('${p.dataUrl}')">
      <img src="${p.dataUrl}" alt="painting">
      ${p.minted ? `<div class="mint-badge">⛓ #${p.minted.tokenId}</div>` : ''}
      <div class="secret">${p.secret.substring(0, 40)}${p.secret.length > 40 ? '…' : ''}</div>
    </div>
  `).join('');
  grid.innerHTML = seeded + local;
  if (savedPaintings.length === 0 && seededWorks.length === 0) {
    grid.innerHTML = '<div style="text-align:center;opacity:0.15;padding:40px;font-size:10px;letter-spacing:2px;grid-column:1/-1">the gallery is empty<br>paint something. tell a secret.</div>';
  }
}

function viewPainting(dataUrl) {
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `<img src="${dataUrl}" alt="painting">`;
  modal.onclick = () => modal.remove();
  document.body.appendChild(modal);
}

function downloadPainting() {
  const link = document.createElement('a');
  link.download = 'painting-' + Date.now() + '.png';
  link.href = canvas.toDataURL();
  link.click();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 's' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); savePainting(); }
  if (e.key === 'z' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); undoStroke(); }
});

/* ============ NFT LAYER · PaintingsForSecrets ============ */
// Self-contained: no CDN, no external scripts. Wallet flows through
// window.ethereum (MetaMask) when present, else the in-page key vault from
// ./chain.js (PBKDF2 → AES-GCM, signed + sent via fallback Polygon RPCs).

const PFS_ADDRESS = '0x0000000000000000000000000000000000000000'; // TODO: deployed contract
const TARGET_CHAIN_ID = '0x89';      // Polygon mainnet (Amoy testnet: 0x13882)
const TARGET_CHAIN_NAME = 'Polygon';
const TARGET_RPC = 'https://polygon-rpc.com';
const TARGET_EXPLORER = 'https://polygonscan.com';
const DEFAULT_FEE_WEI = 0x38d7ea4c68000; // 0.001 POL

// 4-byte selectors, precomputed with keccak256(signature)
const SEL_MINT = '0x02341c71';                 // mint(string,string,string,string)
const SEL_GIFT_MINT = '0x11ff946d';            // giftMint(string,string,string,string,address)
const SEL_MINT_FEE = '0x13966db5';             // mintFee()

function abiToHex(s) {
  return Array.from(new TextEncoder().encode(s)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function abiEncode(selector, args) {
  const headWords = [];
  const tails = [];
  for (const a of args) {
    if (a.t === 'a') {
      headWords.push(a.v.toLowerCase().replace(/^0x/, '').padStart(64, '0'));
    } else {
      const hex = abiToHex(a.v);
      const words = Math.ceil(hex.length / 64);
      const padded = hex.padEnd(words * 64, '0');
      tails.push({ len: hex.length / 2, padded });
      headWords.push(null);
    }
  }
  let head = '';
  let tail = '';
  let cursor = headWords.length * 32;
  let ti = 0;
  for (let i = 0; i < args.length; i++) {
    if (args[i].t === 's') {
      const t = tails[ti++];
      head += cursor.toString(16).padStart(64, '0');
      tail += t.len.toString(16).padStart(64, '0') + t.padded;
      cursor += 32 + t.padded.length / 2;
    } else {
      head += headWords[i];
    }
  }
  return selector + head + tail;
}

// deterministic port of redraw() — spray uses a seeded PRNG so every render matches
function fmt(n) { return Number(n.toFixed(2)); }
function hashSeed(a, b, c) { return ((a * 73856093) ^ (b * 19349663) ^ (c * 83492791)) >>> 0; }
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function sprayDots(x, y, size, color, strokeIndex) {
  const rnd = mulberry32(hashSeed(Math.round(x * 1000), Math.round(y * 1000), strokeIndex + 1));
  const n = Math.max(1, Math.floor(size * 3));
  let out = '';
  for (let i = 0; i < n; i++) {
    const sx = x + (rnd() - 0.5) * size * 4;
    const sy = y + (rnd() - 0.5) * size * 4;
    const rr = rnd() * 2;
    const alpha = 0.3 + rnd() * 0.4;
    out += '<circle cx="' + fmt(sx) + '" cy="' + fmt(sy) + '" r="' + fmt(rr) +
      '" fill="' + color + '" fill-opacity="' + alpha.toFixed(2) + '"/>';
  }
  return out;
}
function strokeToSVGBody(strokes) {
  const bg = '#0a0410';
  let parts = [];
  strokes.forEach(function (stroke, si) {
    if (!stroke || stroke.length === 0) return;
    const p0 = stroke[0];
    const tool = p0.tool || 'brush';
    const color = tool === 'eraser' ? bg : (p0.color || '#ff69b4');
    if (tool === 'spray') {
      for (let i = 0; i < stroke.length; i++) {
        const pt = stroke[i];
        parts.push(sprayDots(pt.x, pt.y, pt.size || p0.size, pt.tool === 'eraser' ? bg : (pt.color || color), si));
      }
      return;
    }
    if (stroke.length === 1) {
      const r = Math.max(0.5, p0.size / 2);
      parts.push('<circle cx="' + fmt(p0.x) + '" cy="' + fmt(p0.y) + '" r="' + fmt(r) + '" fill="' + color + '"/>');
      return;
    }
    let d = 'M ' + fmt(p0.x) + ' ' + fmt(p0.y);
    for (let i = 1; i < stroke.length; i++) d += ' L ' + fmt(stroke[i].x) + ' ' + fmt(stroke[i].y);
    parts.push('<path d="' + d + '" fill="none" stroke="' + color + '" stroke-width="' + fmt(p0.size) +
      '" stroke-linecap="round" stroke-linejoin="round"/>');
  });
  return parts.join('');
}
function mintPayload(strokes, title, secret) {
  return {
    svgBody: strokeToSVGBody(strokes),
    strokes: JSON.stringify(strokes),
    title: title || 'Untitled',
    secret: secret || 'a secret untold'
  };
}

let walletAccount = null;

function shortAddr(a) { return a ? a.slice(0, 6) + '…' + a.slice(-4) : '—'; }
function setStatus(msg) { const el = document.getElementById('status'); if (el) el.textContent = msg; }
function setWalletChip(text, dim) { const el = document.getElementById('wallet-status'); if (el) { el.textContent = text; el.classList.toggle('chip-dim', !!dim); } }

function vaultMode() { return !!window.chain && !window.ethereum; }

function refreshVaultChip() {
  if (!window.chain) return;
  const addr = window.chain.isUnlocked() ? window.chain.sessionAddress() : null;
  setWalletChip(addr ? shortAddr(addr) + ' · in-page' : (window.chain.hasVault() ? 'wallet: locked' : 'wallet: —'), !addr);
}

function initVaultUI() {
  const bar = document.getElementById('wallet-bar');
  const createBtn = document.getElementById('wallet-create-btn');
  const unlockBtn = document.getElementById('wallet-unlock-btn');
  const lockBtn = document.getElementById('wallet-lock-btn');
  const exportBtn = document.getElementById('wallet-export-btn');
  if (!window.chain || !bar) { if (window.ethereum) setWalletChip(walletAccount ? shortAddr(walletAccount) + ' · ' + TARGET_CHAIN_NAME : 'wallet: MetaMask', !walletAccount); return; }
  const mode = vaultMode();
  bar.hidden = !mode;
  if (!mode) { if (window.ethereum) setWalletChip(walletAccount ? shortAddr(walletAccount) + ' · ' + TARGET_CHAIN_NAME : 'wallet: MetaMask', !walletAccount); return; }
  const has = window.chain.hasVault();
  const unlocked = window.chain.isUnlocked();
  createBtn.hidden = has;
  unlockBtn.hidden = !has || unlocked;
  lockBtn.hidden = !has || !unlocked;
  exportBtn.hidden = !unlocked;
  refreshVaultChip();
}

async function createVaultFlow() {
  const pw = prompt('create wallet passphrase — it encrypts your key in this browser (keep it secret, keep it safe)');
  if (!pw) return;
  const pw2 = prompt('repeat the passphrase');
  if (pw !== pw2) { setStatus('passphrases do not match'); return; }
  try {
    const res = await window.chain.createVault(pw);
    setStatus('wallet created — ' + res.address);
  } catch (e) {
    setStatus('wallet create failed: ' + (e && e.message ? e.message : e));
  }
  initVaultUI();
}

async function unlockVaultFlow() {
  const pw = prompt('enter your passphrase to unlock the wallet');
  if (!pw) return;
  const res = await window.chain.unlock(pw);
  setStatus(res && res.ok ? 'wallet unlocked — ' + res.address : 'unlock failed: ' + ((res && res.reason) || 'wrong passphrase'));
  initVaultUI();
}

function lockVaultFlow() {
  window.chain.lock();
  setStatus('wallet locked');
  initVaultUI();
}

async function exportKeyFlow() {
  const pw = prompt('re-enter passphrase to reveal the private key (for manual import into MetaMask)');
  if (!pw) return;
  const res = await window.chain.unlock(pw);
  if (!res || !res.ok) { setStatus('export cancelled — wrong passphrase'); return; }
  const key = window.chain.sessionKeyHex();
  try {
    await navigator.clipboard.writeText(key);
    setStatus('private key copied — MetaMask: add account → import → paste');
  } catch (e) {
    prompt('copy this private key (never share it)', key);
  }
}

async function connectWallet() {
  if (!window.ethereum) { setStatus('no wallet found — install MetaMask or Coinbase Wallet'); return null; }
  try {
    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
    walletAccount = accounts[0] || null;
    setWalletChip(walletAccount ? shortAddr(walletAccount) + ' · ' + TARGET_CHAIN_NAME : 'wallet: —');
    return walletAccount;
  } catch (e) {
    setStatus('wallet connect: ' + (e && e.message ? e.message : e));
    return null;
  }
}

async function ensureChain() {
  if (!window.ethereum) return false;
  try {
    const id = await window.ethereum.request({ method: 'eth_chainId' });
    if (id === TARGET_CHAIN_ID) return true;
  } catch (e) { /* fall through to switch */ }
  try {
    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: TARGET_CHAIN_ID }] });
    return true;
  } catch (e) {
    if (e && e.code === 4902) {
      await window.ethereum.request({
        method: 'wallet_addEthereumChain',
        params: [{
          chainId: TARGET_CHAIN_ID,
          chainName: TARGET_CHAIN_NAME,
          nativeCurrency: { name: 'POL', symbol: 'POL', decimals: 18 },
          rpcUrls: [TARGET_RPC],
          blockExplorerUrls: [TARGET_EXPLORER]
        }]
      });
      return true;
    }
    setStatus('switch to ' + TARGET_CHAIN_NAME + ': ' + (e && e.message ? e.message : e));
    return false;
  }
}

function contractDeployed() {
  return /0x[0-9a-fA-F]{40}$/.test(PFS_ADDRESS) && PFS_ADDRESS.toLowerCase() !== '0x' + '0'.repeat(40);
}

async function mintFeeWei() {
  try {
    if (window.ethereum) {
      const res = await window.ethereum.request({
        method: 'eth_call',
        params: [{ to: PFS_ADDRESS, data: SEL_MINT_FEE }, 'latest']
      });
      if (res && res.length >= 66) return res;
    } else if (window.chain) {
      const res = await window.chain.call(PFS_ADDRESS, SEL_MINT_FEE);
      if (res && res.length >= 2) return res.startsWith('0x') ? res : '0x' + res;
    }
  } catch (e) { /* fall back to default */ }
  return '0x' + DEFAULT_FEE_WEI.toString(16);
}

function sanitize(s) { return String(s == null ? '' : s).replace(/["\\\n\r]/g, ' ').trim(); }

async function waitReceipt(hash, timeoutMs) {
  const start = Date.now();
  while (Date.now() - start < timeoutMs) {
    const rec = window.ethereum
      ? await window.ethereum.request({ method: 'eth_getTransactionReceipt', params: [hash] })
      : await window.chain.getReceipt(hash);
    if (rec && rec.status === '0x1') return rec;
    if (rec && rec.status === '0x0') return null;
    await new Promise(r => setTimeout(r, 4000));
  }
  return null;
}

function parseTokenId(receipt) {
  if (!receipt || !receipt.logs) return null;
  for (const log of receipt.logs) {
    if (!log || !log.topics) continue;
    if (log.topics[0] === '0xdb163f1bba8c98dc902f1e81407bf65c5a4b94308fa47719664a06b52af601aa') return BigInt(log.topics[1]).toString();
  }
  return null;
}

async function sendMintTx({ data, value, verb }) {
  setStatus(verb + '…');
  try {
    if (window.ethereum) {
      const account = walletAccount || await connectWallet();
      if (!account) return null;
      if (!(await ensureChain())) return null;
      return await window.ethereum.request({
        method: 'eth_sendTransaction',
        params: [{ from: account, to: PFS_ADDRESS, value, data }]
      });
    }
    if (!window.chain || !window.chain.isUnlocked()) { setStatus('wallet locked — ⚿ unlock first'); return null; }
    return await window.chain.sendRawTx({ to: PFS_ADDRESS, value, data });
  } catch (e) {
    setStatus(verb + ' failed: ' + (e && (e.shortMessage || e.message) ? (e.shortMessage || e.message) : e));
    return null;
  }
}

async function mintPainting() {
  if (strokes.length === 0) { setStatus('paint something first'); return; }
  if (!contractDeployed()) { setStatus('contract not deployed yet — set PFS_ADDRESS'); return; }
  const secret = sanitize(document.getElementById('secret-input').value) || 'a secret untold';
  const title = sanitize(prompt('name this painting', secret.slice(0, 24))) || 'untitled';
  const p = mintPayload(strokes, title, secret);
  const data = abiEncode(SEL_MINT, [{ t: 's', v: p.svgBody }, { t: 's', v: p.strokes }, { t: 's', v: p.title }, { t: 's', v: p.secret }]);
  const value = await mintFeeWei();
  const tx = await sendMintTx({ data, value, verb: 'minting' });
  if (!tx) return;
  const receipt = await waitReceipt(tx, 120000);
  const tokenId = parseTokenId(receipt);
  saveToGallery(canvas.toDataURL('image/png'), p.secret, tokenId);
  setStatus(tokenId
    ? 'minted — #' + tokenId + ' · ' + tx.slice(0, 10) + '… · ' + TARGET_EXPLORER + '/tx/' + tx
    : 'minted — ' + tx.slice(0, 10) + '… · ' + TARGET_EXPLORER + '/tx/' + tx);
}

async function giftPainting() {
  if (strokes.length === 0) { setStatus('paint something first'); return; }
  if (!contractDeployed()) { setStatus('contract not deployed yet — set PFS_ADDRESS'); return; }
  const recipient = sanitize(prompt('recipient address — only they can claim it'));
  if (!recipient || !/^0x[0-9a-fA-F]{40}$/.test(recipient)) { setStatus('invalid recipient address'); return; }
  const secret = sanitize(document.getElementById('secret-input').value) || 'a secret untold';
  const title = sanitize(prompt('name this painting', secret.slice(0, 24))) || 'untitled';
  const p = mintPayload(strokes, title, secret);
  const data = abiEncode(SEL_GIFT_MINT, [{ t: 's', v: p.svgBody }, { t: 's', v: p.strokes }, { t: 's', v: p.title }, { t: 's', v: p.secret }, { t: 'a', v: recipient }]);
  const value = await mintFeeWei();
  const tx = await sendMintTx({ data, value, verb: 'sealing gift' });
  if (!tx) return;
  const receipt = await waitReceipt(tx, 120000);
  const tokenId = parseTokenId(receipt);
  saveToGallery(canvas.toDataURL('image/png'), p.secret, tokenId);
  setStatus(tokenId
    ? 'sealed — #' + tokenId + ' for ' + recipient.slice(0, 6) + '… · ' + TARGET_EXPLORER + '/tx/' + tx
    : 'sealed — ' + tx.slice(0, 10) + '… · ' + TARGET_EXPLORER + '/tx/' + tx);
}

function saveToGallery(dataUrl, secret, tokenId) {
  const painting = {
    id: Date.now(),
    dataUrl,
    secret,
    date: new Date().toISOString(),
    colors: [...new Set(strokes.flatMap(s => s.map(pt => pt.color)))].filter(c => c !== '#0a0410'),
  };
  if (tokenId) painting.minted = { tokenId };
  savedPaintings.unshift(painting);
  if (savedPaintings.length > 42) savedPaintings = savedPaintings.slice(0, 42);
  localStorage.setItem('art_vaked_gallery', JSON.stringify(savedPaintings));
  renderGallery();
}

if (window.ethereum) {
  window.ethereum.on('accountsChanged', accounts => {
    walletAccount = (accounts && accounts[0]) || null;
    setWalletChip(walletAccount ? shortAddr(walletAccount) + ' · ' + TARGET_CHAIN_NAME : 'wallet: —', !walletAccount);
  });
  window.ethereum.on('chainChanged', () => {
    setWalletChip(walletAccount ? shortAddr(walletAccount) + ' · ' + TARGET_CHAIN_NAME : 'wallet: —', !walletAccount);
  });
}

document.addEventListener('DOMContentLoaded', initVaultUI);

renderGallery();
</script>
